[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.14.2",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv]
package = false

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }

[tool.mypy]
exclude = ["^llm_sdk/", "^scratch/"]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llm_sdk"
follow_imports = "skip"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
]
